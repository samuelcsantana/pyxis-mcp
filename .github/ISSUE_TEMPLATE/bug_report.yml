name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Security issues go through private vulnerability reporting instead, never a public issue. Never paste an access token.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked the agent, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The client configuration (without the token) and the smallest request that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: pyxis-mcp 0.1.0, Node 24, Claude Code on macOS
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: What the server wrote to stderr, with any token or personal data removed.
      render: text
